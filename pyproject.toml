[project]
name = "supportdesk-api"
version = "0.1.0"
description = "Customer Support Ticket Management API"
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]==3.3.9",
    "pydantic-settings==2.16.3",
    "python-dotenv==1.2.4"
]

[project.optional-dependencies]
def=[
    "pytest",
    "httpx"
]